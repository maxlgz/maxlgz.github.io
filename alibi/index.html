<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF6E3">
  <meta name="description" content="Alibi — un jeu de déduction : placez chaque personnage sur le plan, puis démasquez le coupable.">
  <title>Alibi — jeu de déduction</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Alibi">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="Alibi">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" media="print" onload="this.media='all'">
  <style>body { margin: 0; background: #FFF6E3; color: #1F2147; font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; } .notice { padding: 24px; font-family: 'Fredoka', 'Nunito', system-ui, sans-serif; font-weight: 600; }</style>
</head>
<body>
  <div id="app"><p class="notice">Chargement du dossier…</p></div>
  <noscript><p class="notice">Alibi a besoin de JavaScript pour fonctionner.</p></noscript>
  <script>
    // Toujours à jour : le service worker du jeu (sw.js) redemande chaque fichier au réseau.
    // Tant qu'il ne contrôle pas encore la page (première visite), on attend qu'il prenne la main
    // puis on recharge une fois, pour ne jamais exécuter des fichiers restés dans le cache du navigateur.
    (function () {
      function boot() {
        if (boot.done) return;
        boot.done = true;
        // Feuilles de style puis script, tous chargés une fois le service worker aux commandes.
        var left = 2;
        function ready() {
          if (--left) return;
          var s = document.createElement('script');
          s.type = 'module';
          s.src = 'js/main.js';
          document.body.appendChild(s);
        }
        ['styles.css', 'editor.css'].forEach(function (href) {
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = href;
          l.onload = l.onerror = ready;
          document.head.appendChild(l);
        });
      }
      var sw = navigator.serviceWorker;
      if (!sw) { boot(); return; }
      function ours() {
        return !!(sw.controller && /\/alibi\/sw\.js$/.test(new URL(sw.controller.scriptURL).pathname));
      }
      var register = function () { return sw.register('sw.js').catch(function () {}); };
      if (ours()) { register(); boot(); return; }
      var reloaded = false;
      try { reloaded = sessionStorage.getItem('alibi:sw-reload') === '1'; } catch (e) {}
      if (reloaded) { register(); boot(); return; }
      sw.addEventListener('controllerchange', function () {
        if (!ours() || boot.done) return;
        try { sessionStorage.setItem('alibi:sw-reload', '1'); } catch (e) {}
        location.reload();
      });
      register();
      setTimeout(boot, 4000);
    })();
  </script>
</body>
</html>
