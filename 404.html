<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Redirection…</title>
  <style>
    body { margin: 0; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1c2238; background: #f5f6fa; }
    main { max-width: 560px; margin: 12vh auto; padding: 24px; background: #fff; border: 1px solid #e3e6ee; border-radius: 10px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    a { color: #3f51b5; }
    .muted { color: #6b7280; }
    .target { word-break: break-all; font-weight: 600; }
    .btn { display: inline-block; margin-top: 14px; padding: 10px 16px; background: #3f51b5; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Redirection…</h1>
    <p id="text" class="muted">Un instant.</p>
    <p id="target" class="target" hidden></p>
    <p id="more"></p>
  </main>
  <script>
  // Liens courts : /url/<code> redirige vers la cible enregistrée dans
  // url/links.json ; /url/<code>+ affiche la cible sans rediriger (comme Polr).
  (async () => {
    const m = location.pathname.match(/^\/url\/([A-Za-z0-9_-]{1,32})(\+?)\/?$/);
    const title = document.getElementById('title'), text = document.getElementById('text'), tgt = document.getElementById('target'), more = document.getElementById('more');
    if (!m) {
      title.textContent = 'Page introuvable';
      text.textContent = 'Cette adresse n’existe pas sur ce site.';
      more.innerHTML = '<a class="btn" href="/">Retour à l’accueil</a>';
      return;
    }
    const [, code, preview] = m;
    const owner = location.hostname.split('.')[0];
    const sources = [
      `/url/links.json?t=${Date.now()}`,
      // la copie publiée peut avoir jusqu'à dix minutes de retard : on lit
      // ensuite le dépôt lui-même (branche publiée par GitHub Pages)
      `https://raw.githubusercontent.com/${owner}/${location.hostname}/claude/piano-learning-app-1mGiF/url/links.json?t=${Date.now()}`,
    ];
    let entry = null;
    for (const src of sources) {
      try {
        const r = await fetch(src, { cache: 'no-store' });
        if (!r.ok) continue;
        const links = await r.json();
        if (links && links[code]) { entry = links[code]; break; }
      } catch (e) { /* source suivante */ }
    }
    if (!entry) {
      title.textContent = 'Lien inconnu';
      text.textContent = `Aucun lien court « ${code} » — il a peut-être été supprimé, ou vient d’être créé et n’est pas encore publié.`;
      more.innerHTML = '<a class="btn" href="/url/">Raccourcisseur</a>';
      return;
    }
    tgt.hidden = false; tgt.textContent = entry.u;
    if (preview) {
      title.textContent = `Aperçu de /url/${code}`;
      text.textContent = `Ce lien court mène vers :`;
      more.innerHTML = `<a class="btn" href="${entry.u.replace(/"/g, '&quot;')}" rel="noopener">Y aller</a>`;
      return;
    }
    text.textContent = 'Vous allez être redirigé vers :';
    more.innerHTML = `<a href="${entry.u.replace(/"/g, '&quot;')}" rel="noopener">Cliquer ici si rien ne se passe</a>`;
    location.replace(entry.u);
  })();
  </script>
</body>
</html>
